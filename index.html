<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Flow</title>
  <style>
    :root {
      --blue: #3157d5;
      --blue-dark: #2442a8;
      --light-blue: #edf3ff;
      --text: #172033;
      --muted: #667085;
      --border: #dde4ef;
      --background: #f5f7fb;
      --danger: #c93434;
      --success: #14804a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(100% - 24px, 960px);
      margin: 0 auto;
      padding: 28px 0;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 38px);
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card,
    .basket {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(41, 56, 86, 0.08);
    }

    .card {
      overflow: hidden;
    }

    .card-body {
      padding: 18px;
    }

    .product-name {
      margin: 0 0 12px;
      font-size: 21px;
    }

    .product-info {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .product-info strong {
      color: var(--text);
    }

    .quantity-label {
      display: block;
      margin-top: 16px;
      font-weight: 700;
    }

    .quantity-control {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity-control button,
    .quantity-control input {
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      font-size: 18px;
      text-align: center;
    }

    .quantity-control button {
      color: var(--blue);
      font-weight: bold;
      cursor: pointer;
    }

    .quantity-control button:hover {
      background: var(--light-blue);
    }

    .quantity-control input::-webkit-inner-spin-button {
      display: none;
    }

    .basket {
      margin-top: 18px;
      padding: 20px;
    }

    .basket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .basket h2 {
      margin: 0;
    }

    #basketList {
      margin-top: 14px;
    }

    .empty {
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
    }

    .basket-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0;
      font-size: 21px;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 10px;
    }

    .action-button {
      height: 48px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #confirmButton {
      background: var(--blue);
      color: white;
    }

    #confirmButton:hover {
      background: var(--blue-dark);
    }

    #clearButton {
      background: #edf0f5;
      color: var(--text);
    }

    #message {
      min-height: 24px;
      margin: 14px 0 0;
      font-weight: bold;
    }

    .error {
      color: var(--danger);
    }

    .success {
      color: var(--success);
    }

    #receipt {
      display: none;
      margin-top: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafbfe;
      white-space: pre-line;
      font-family: monospace;
      line-height: 1.6;
    }

    #receipt.visible {
      display: block;
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 16px, 960px);
        padding: 16px 0;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .basket {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>APex Flow добро пожаловать</h1>
      <p>Выберите товары и оформите покупку</p>
    </header>

    <section class="products" id="products"></section>

    <section class="basket">
      <div class="basket-header">
        <h2>Корзина</h2>
      </div>

      <div id="basketList"></div>
      <div class="total">
        <span>Итого</span>
        <span id="total">0 тг</span>
      </div>

      <div class="actions">
        <button class="action-button" id="confirmButton" type="button">
          Подтвердить покупку
        </button>
        <button class="action-button" id="clearButton" type="button">
          Очистить
        </button>
      </div>

      <p id="message" aria-live="polite"></p>
      <div id="receipt"></div>
    </section>
  </main>

  <script>
    const products = [
      { id: "postcard", name: "Открытка", price: 300, stock: 5 },
      { id: "badge", name: "Значок", price: 500, stock: 3 },
      { id: "bookmark", name: "Закладка", price: 150, stock: 4 }
    ];

    const cart = {
      postcard: 0,
      badge: 0,
      bookmark: 0
    };

    const productsElement = document.getElementById("products");
    const basketListElement = document.getElementById("basketList");
    const totalElement = document.getElementById("total");
    const messageElement = document.getElementById("message");
    const receiptElement = document.getElementById("receipt");

    function renderProducts() {
      productsElement.innerHTML = "";

      products.forEach(product => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-body">
            <h2 class="product-name">${product.name}</h2>
            <div class="product-info">
              <span>Цена</span>
              <strong>${product.price} тг</strong>
            </div>
            <div class="product-info">
              <span>На столе</span>
              <strong><span id="stock-${product.id}">${product.stock}</span> шт.</strong>
            </div>
            <label class="quantity-label" for="quantity-${product.id}">
              Количество
            </label>
            <div class="quantity-control">
              <button type="button" data-action="minus" data-id="${product.id}">−</button>
              <input
                id="quantity-${product.id}"
                type="number"
                min="0"
                step="1"
                value="${cart[product.id]}"
              >
              <button type="button" data-action="plus" data-id="${product.id}">+</button>
            </div>
          </div>
        `;
        productsElement.appendChild(card);

        const input = card.querySelector("input");

        input.addEventListener("input", () => {
          let quantity = Number.parseInt(input.value, 10);

          if (!Number.isInteger(quantity) || quantity < 0) {
            quantity = 0;
          }

          cart[product.id] = quantity;
          input.value = quantity;
          clearStatus();
          renderBasket();
        });
      });

      document.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", () => {
          const productId = button.dataset.id;
          const input = document.getElementById(`quantity-${productId}`);
          let quantity = cart[productId];

          if (button.dataset.action === "plus") {
            quantity++;
          } else {
            quantity = Math.max(0, quantity - 1);
          }

          cart[productId] = quantity;
          input.value = quantity;
          clearStatus();
          renderBasket();
        });
      });
    }

    function renderBasket() {
      const selected = products.filter(product => cart[product.id] > 0);

      if (selected.length === 0) {
        basketListElement.innerHTML =
          '<div class="empty">Корзина пуста</div>';
        totalElement.textContent = "0 тг";
        return;
      }

      basketListElement.innerHTML = "";
      let total = 0;

      selected.forEach(product => {
        const quantity = cart[product.id];
        const sum = quantity * product.price;
        total += sum;

        basketListElement.insertAdjacentHTML(
          "beforeend",
          `
            <div class="basket-row">
              <span>${product.name} × ${quantity}</span>
              <strong>${sum} тг</strong>
            </div>
          `
        );
      });

      totalElement.textContent = `${total} тг`;
    }

    function clearStatus() {
      messageElement.textContent = "";
      messageElement.className = "";
      receiptElement.textContent = "";
      receiptElement.className = "";
    }

    function clearCart() {
      products.forEach(product => {
        cart[product.id] = 0;
      });

      renderProducts();
      renderBasket();
    }

    document.getElementById("confirmButton").addEventListener("click", () => {
      clearStatus();

      const selected = products.filter(product => cart[product.id] > 0);

      if (selected.length === 0) {
        messageElement.textContent = "Пустая корзина не оформляется";
        messageElement.className = "error";
        return;
      }

      const unavailable = selected.find(
        product => cart[product.id] > product.stock
      );

      if (unavailable) {
        messageElement.textContent =
          `Недостаточно товара: ${unavailable.name}. Доступно ${unavailable.stock} шт.`;
        messageElement.className = "error";
        return;
      }

      let total = 0;
      let receipt = "ЧЕК\n";

      selected.forEach(product => {
        const quantity = cart[product.id];
        const sum = quantity * product.price;
        total += sum;
        receipt += `${product.name} × ${quantity} — ${sum} тг\n`;
      });

      receipt += `\nИтого: ${total} тг`;

      selected.forEach(product => {
        product.stock -= cart[product.id];
      });

      products.forEach(product => {
        document.getElementById(`stock-${product.id}`).textContent =
          product.stock;
      });

      receiptElement.textContent = receipt;
      receiptElement.className = "visible";
      messageElement.textContent = "Покупка оформлена";
      messageElement.className = "success";

      clearCart();
    });

    document.getElementById("clearButton").addEventListener("click", () => {
      clearStatus();
      clearCart();
    });

    renderProducts();
    renderBasket();
  </script>
</body>
</html>
